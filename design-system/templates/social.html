<!-- @dsCard group="Templates" name="SNS画像" subtitle="正方形告知/OGP横長" width="1200" height="1900" -->
<!--
  使い方 (AI向け):
  - SNS告知は正方形 (実寸1080x1080)、リンク共有のOGPは横長 (実寸1200x630)。ここでは60%縮小で表示している。
  - 書き出し時は .card-1080 / .card-og の実寸をそのまま使う。ロゴ・タイトル・日時・テーマチップの告知カード型で統一する。
  - 背景は --bg。装飾は右下の淡い primary の単色円弧のみ (グラデーション禁止)。文字は最小でも20px相当、余白は広く。
  - 感嘆符・絵文字・誇大表現・再生ボタン・時間バッジは使わない。日付は YYYY-MM-DD 形式。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNS画像 — 臨床学術WG Design System</title>
<style>
  :root {
    --bg: #f5f7fb;
    --surface: #ffffff;
    --surface-2: #eef2f8;
    --ink: #0f172a;
    --ink-2: #475569;
    --muted: #64748b;
    --border: #e3e8f0;

    --primary: #4f46e5;
    --primary-strong: #4338ca;
    --on-primary: #ffffff;
    --accent: #0369a1;
    --primary-tint: rgba(79, 70, 229, 0.08);
    --primary-tint-strong: rgba(79, 70, 229, 0.14);

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-xl: 20px;

    --shadow-1: 0 1px 2px rgba(16, 24, 40, 0.05);
    --shadow-2: 0 8px 24px rgba(16, 24, 40, 0.08);

    --font-sans: "Inter", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;

    --fs-xs: 12px;
    --fs-sm: 14px;
    --fs-md: 16px;
    --fs-lg: 20px;
    --fs-xl: 28px;
    --fs-2xl: 40px;

    /* カテゴリ6色（固定順: 1循環器 2脳神経 3感染症 4基礎レクチャー 5研究・認定 6AI活用） */
    --cat-1: #2a78d6;
    --cat-2: #1baf7a;
    --cat-3: #eda100;
    --cat-4: #008300;
    --cat-5: #4a3aa7;
    --cat-6: #e34948;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; width: 1200px;
    font-family: var(--font-sans); color: var(--ink); background: var(--surface-2);
  }
  .stage { display: grid; gap: 32px; justify-items: start; }
  .stage-note { margin: 0 0 10px; font-size: var(--fs-xs); font-weight: 600; color: var(--muted); }

  /* ---- 縮小ラッパ (実寸をtransformで60%表示) ---- */
  .scale-square { width: 648px; height: 648px; overflow: hidden; }   /* 1080 * 0.6 */
  .scale-og { width: 720px; height: 378px; overflow: hidden; }        /* 1200x630 * 0.6 */
  .card-1080, .card-og { transform: scale(0.6); transform-origin: top left; }

  /* ---- 共通パーツ ---- */
  .chip {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 24px 8px 20px; border-radius: 999px; background: var(--surface-2);
    color: var(--ink-2); font-size: 1.28rem; font-weight: 700;
  }
  .chip .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }
  .cat-1 { --c: var(--cat-1); } .cat-2 { --c: var(--cat-2); } .cat-3 { --c: var(--cat-3); }
  .cat-4 { --c: var(--cat-4); } .cat-5 { --c: var(--cat-5); } .cat-6 { --c: var(--cat-6); }
  .chip-row { display: flex; gap: 20px; }

  .lockup { display: inline-flex; align-items: center; gap: 20px; }
  .lockup-mark { width: 68px; height: 68px; flex: none; display: block; }
  .lockup-name { color: var(--ink); font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }

  /* ---- (a) 正方形告知 1080x1080 ---- */
  .card-1080 {
    position: relative; width: 1080px; height: 1080px; overflow: hidden;
    padding: 96px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-1);
    display: flex; flex-direction: column;
  }
  .card-1080 .arc {
    position: absolute; right: -220px; bottom: -220px; width: 620px; height: 620px;
    border-radius: 50%; background: var(--primary-tint);
  }
  .card-1080 .arc-inner {
    position: absolute; right: -120px; bottom: -120px; width: 400px; height: 400px;
    border-radius: 50%; background: var(--primary-tint-strong);
  }
  .sq-body { position: relative; margin-top: auto; }
  .sq-title {
    margin: 32px 0 0; font-size: 4rem; line-height: 1.2; letter-spacing: -0.01em; font-weight: 700;
    max-width: 820px;
  }
  .sq-date { margin: 32px 0 0; color: var(--ink-2); font-size: 1.9rem; line-height: 1.5; font-variant-numeric: tabular-nums; }
  .sq-foot { position: relative; margin-top: auto; padding-top: 56px; }

  /* ---- (b) OGP横長 1200x630 ---- */
  .card-og {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    padding: 72px 80px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-1);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .card-og .arc {
    position: absolute; right: -160px; bottom: -200px; width: 480px; height: 480px;
    border-radius: 50%; background: var(--primary-tint);
  }
  .og-top { position: relative; }
  .og-title {
    margin: 24px 0 0; font-size: 3rem; line-height: 1.25; letter-spacing: -0.01em; font-weight: 700; max-width: 640px;
  }
  .og-date { margin: 18px 0 0; color: var(--ink-2); font-size: 1.4rem; line-height: 1.5; font-variant-numeric: tabular-nums; }
  .og-bottom { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
</style>
</head>
<body>
  <div class="stage">

    <!-- (a) 正方形告知 -->
    <div>
      <p class="stage-note">正方形告知 — 実寸 1080×1080（表示は60%）</p>
      <div class="scale-square">
        <section class="card-1080">
          <span class="arc" aria-hidden="true"></span>
          <span class="arc-inner" aria-hidden="true"></span>
          <div class="chip-row">
            <span class="chip">第65回 勉強会</span>
            <span class="chip"><span class="dot cat-2"></span>脳神経</span>
          </div>
          <div class="sq-body">
            <h1 class="sq-title">パーキンソン病治療薬の使い分け</h1>
            <p class="sq-date">2026-08-01（土）14:00–15:30<br>ハイブリッド開催 ／ 参加無料・事前申込制</p>
          </div>
          <div class="sq-foot">
            <div class="lockup">
              <svg class="lockup-mark" width="68" height="68" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="7" fill="#4f46e5"/><path d="M7 20h4.7v-4.6h4.6v-4.6H21" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="21" cy="8.2" r="1.6" fill="#ffffff"/></svg>
              <span class="lockup-name">臨床学術WG</span>
            </div>
          </div>
        </section>
      </div>
    </div>

    <!-- (b) OGP横長 -->
    <div>
      <p class="stage-note">OGP横長 — 実寸 1200×630（表示は60%）</p>
      <div class="scale-og">
        <section class="card-og">
          <span class="arc" aria-hidden="true"></span>
          <div class="og-top">
            <div class="chip-row">
              <span class="chip">第65回 勉強会</span>
              <span class="chip"><span class="dot cat-2"></span>脳神経</span>
            </div>
            <h2 class="og-title">パーキンソン病治療薬の使い分け</h2>
            <p class="og-date">2026-08-01（土）14:00–15:30 ／ ハイブリッド開催</p>
          </div>
          <div class="og-bottom">
            <div class="lockup">
              <svg class="lockup-mark" width="44" height="44" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="7" fill="#4f46e5"/><path d="M7 20h4.7v-4.6h4.6v-4.6H21" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="21" cy="8.2" r="1.6" fill="#ffffff"/></svg>
              <span class="lockup-name">臨床学術ワーキンググループ</span>
            </div>
          </div>
        </section>
      </div>
    </div>

  </div>
</body>
</html>
