<!-- @dsCard group="Components" name="フォーム" subtitle="入力欄/必須マーク/ボット判定枠/送信結果" width="640" height="820" -->
<!--
  使い方 (AI向け):
  - app/contact/contact-form.tsx とそのCSSからの忠実な移植。ラベル横の赤い「**」が必須マークの正式仕様(視覚的には規約外に見えるがサイト実装が正)。
  - placeholderは実装のまま流用する: お名前は「例: 山田 太郎」、メールは「example@example.com」。
  - ボット判定枠は外部ウィジェット(Cloudflare Turnstile)の読み込み位置を示すプレースホルダーで、実際のウィジェットは埋め込まない。
  - 送信結果は成功(success-tint)/エラー(danger-tint)の2状態のみ。中間状態(警告色)は作らない。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フォーム — 臨床学術WG Design System</title>
<style>
  :root {
    --surface: #ffffff;
    --surface-2: #eef2f8;
    --ink: #0f172a;
    --ink-2: #475569;
    --muted: #64748b;
    --border: #e3e8f0;
    --primary: #4f46e5;
    --primary-strong: #4338ca;
    --on-primary: #ffffff;
    --danger: #b91c1c;
    --success-tint: rgba(21, 128, 61, 0.12);
    --danger-tint: rgba(185, 28, 28, 0.12);
    --success: #15803d;
    --radius-md: 10px;
    --fs-xs: 12px;
    --fs-sm: 14px;
    --font-sans: "Inter", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px; font-family: var(--font-sans);
    color: var(--ink); background: #f5f7fb;
  }
  .spec-label {
    margin: 0 0 10px; font-size: 12px; font-weight: 700;
    letter-spacing: 0.04em; color: var(--muted);
  }
  .spec-block + .spec-block { margin-top: 22px; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ===== フォーム (app/contact/contact-form.module.css を忠実に移植) ===== */
  .form { display: flex; flex-direction: column; gap: 18px; max-width: 480px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-label { display: inline-flex; align-items: center; gap: 4px; color: var(--ink); font-size: var(--fs-sm); font-weight: 600; }
  .required-badge { color: var(--danger); font-weight: 700; }
  .field input, .field textarea {
    padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-md);
    background: var(--surface); color: var(--ink); font-family: inherit; font-size: var(--fs-sm);
  }
  .field textarea { min-height: 140px; resize: vertical; }
  .field input::placeholder, .field textarea::placeholder { color: var(--muted); }

  .turnstile { display: flex; flex-direction: column; gap: 8px; }
  .turnstile > span { color: var(--muted); font-size: var(--fs-xs); font-weight: 600; }
  .turnstile-shell {
    display: flex; align-items: center; justify-content: center; min-height: 66px;
    border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface-2);
    color: var(--muted); font-size: var(--fs-xs);
  }

  .feedback { padding: 10px 14px; border-radius: var(--radius-md); font-size: var(--fs-sm); font-weight: 600; }
  .feedback-success { background: var(--success-tint); color: var(--success); }
  .feedback-error { background: var(--danger-tint); color: var(--danger); }

  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .helper-note { color: var(--muted); font-size: var(--fs-xs); }

  .button {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 9px 16px; border: 1px solid transparent; border-radius: var(--radius-md);
    background: var(--primary); color: var(--on-primary); font-family: inherit;
    font-size: var(--fs-sm); font-weight: 600; line-height: 1.4; cursor: pointer;
  }
  .button:disabled { opacity: 0.55; cursor: not-allowed; }
</style>
</head>
<body>

  <div class="spec-block">
    <p class="spec-label">入力欄 — ラベル+必須マーク(赤い **)+placeholder。フォームは18pxの縦積み</p>
    <form class="form">
      <div class="field">
        <label class="field-label" for="ds-name">
          <span>お名前</span>
          <span class="required-badge" aria-hidden="true">**</span>
          <span class="visually-hidden">必須項目</span>
        </label>
        <input id="ds-name" type="text" autocomplete="name" placeholder="例: 山田 太郎">
      </div>
      <div class="field">
        <label class="field-label" for="ds-email">
          <span>メールアドレス</span>
          <span class="required-badge" aria-hidden="true">**</span>
          <span class="visually-hidden">必須項目</span>
        </label>
        <input id="ds-email" type="email" autocomplete="email" placeholder="example@example.com">
      </div>
      <div class="field">
        <label class="field-label" for="ds-message">
          <span>お問い合わせ内容</span>
          <span class="required-badge" aria-hidden="true">**</span>
          <span class="visually-hidden">必須項目</span>
        </label>
        <textarea id="ds-message" placeholder="対象ページや確認したい点を記載してください"></textarea>
      </div>

      <div class="turnstile">
        <span>ボット判定</span>
        <div class="turnstile-shell">Cloudflare Turnstile ウィジェット表示枠</div>
      </div>

      <div class="actions">
        <button class="button" type="submit">送信する</button>
        <span class="helper-note">送信前に Turnstile 認証を完了してください。</span>
      </div>
    </form>
  </div>

  <div class="spec-block">
    <p class="spec-label">送信結果 — 成功(success-tint) / エラー(danger-tint)の2状態のみ</p>
    <div class="form" style="gap: 10px;">
      <div class="feedback feedback-success" role="status">送信しました。担当者が内容を確認します。</div>
      <div class="feedback feedback-error" role="alert">必須項目が入力されていません。赤い ** の付いた項目を確認してください。</div>
    </div>
  </div>

</body>
</html>
