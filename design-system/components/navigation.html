<!-- @dsCard group="Components" name="ナビゲーション" subtitle="ヘッダー/タブ/フッター" width="1100" height="560" -->
<!--
  使い方 (AI向け):
  - ヘッダーは全ページ共通・高さ60px・sticky・surface地+下ボーダー。ロゴ+「臨床学術WG」、ナビ5項目 (ホーム/アーカイブ/コース/カレンダー/ダッシュボード)、右端にテーマ切替ボタン。
  - アクティブなナビ項目は aria-current="page" でsurface-2地+primary文字+太字にする。下線や色替えの独自表現を足さない。
  - タブは surface-2地のコンテナ(radius-md・padding4px)に、アクティブだけsurface面+primary文字+shadow-1。
  - フッターはpanelではなくsurface地+上ボーダーの帯。左に法務リンク、右に運営表記。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ナビゲーション — 臨床学術WG Design System</title>
<style>
  :root {
    --bg: #f5f7fb;
    --surface: #ffffff;
    --surface-2: #eef2f8;
    --ink: #0f172a;
    --ink-2: #475569;
    --muted: #64748b;
    --border: #e3e8f0;
    --primary: #4f46e5;
    --radius-sm: 6px;
    --radius-md: 10px;
    --shadow-1: 0 1px 2px rgba(16, 24, 40, 0.05);
    --fs-xs: 12px;
    --fs-sm: 14px;
    --fs-md: 16px;
    --font-sans: "Inter", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; font-family: var(--font-sans);
    color: var(--ink); background: var(--bg);
  }
  .spec-label {
    margin: 0 0 10px; padding: 0 28px; font-size: 12px; font-weight: 700;
    letter-spacing: 0.04em; color: var(--muted);
  }
  .spec-block { padding-bottom: 26px; }
  .wrap { width: 100%; max-width: 1200px; margin-inline: auto; padding-inline: 24px; }

  /* ===== ヘッダー (app/components/app-header.module.css を忠実に移植) ===== */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); }
  .header-inner { display: flex; align-items: center; gap: 24px; height: 60px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); font-size: var(--fs-md); font-weight: 700; letter-spacing: 0.02em; text-decoration: none; }
  .brand svg { flex: none; }
  .site-nav { display: flex; align-items: center; gap: 4px; margin-right: auto; }
  .site-nav a { padding: 6px 12px; border-radius: var(--radius-md); color: var(--ink-2); font-size: var(--fs-sm); font-weight: 500; text-decoration: none; }
  .site-nav a:hover { background: var(--surface-2); color: var(--ink); }
  .site-nav a[aria-current="page"] { background: var(--surface-2); color: var(--primary); font-weight: 600; }
  .header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .toggle-button {
    display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px;
    border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); color: var(--ink-2);
  }

  /* ===== タブ (app/ui/tabs.module.css を忠実に移植) ===== */
  .tabs { display: inline-flex; gap: 2px; padding: 4px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface-2); }
  .tab { display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--ink-2); font-family: inherit; font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; }
  .tab.active { background: var(--surface); color: var(--primary); font-weight: 600; box-shadow: var(--shadow-1); }

  /* ===== フッター (app/components/app-footer.module.css を忠実に移植) ===== */
  .footer { border-top: 1px solid var(--border); background: var(--surface); }
  .footer-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 24px; padding-bottom: 24px; }
  .footer-nav { display: flex; flex-wrap: wrap; gap: 4px 20px; }
  .footer-nav a { color: var(--ink-2); font-size: var(--fs-sm); text-decoration: none; }
  .footer-nav a:hover { color: var(--primary); text-decoration: underline; }
  .footer-note { color: var(--muted); font-size: var(--fs-xs); }
</style>
</head>
<body>

  <div class="spec-block">
    <p class="spec-label">ヘッダー — 高さ60px・sticky・ロゴ+ブランド名・ナビ5項目(aria-current)・右端にテーマ切替</p>
    <header class="header">
      <div class="wrap header-inner">
        <a class="brand" href="#">
          <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
            <rect x="1" y="1" width="26" height="26" rx="7" fill="#4f46e5"/>
            <path d="M7 20h4.7v-4.6h4.6v-4.6H21" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="21" cy="8.2" r="1.6" fill="#ffffff"/>
          </svg>
          <span>臨床学術WG</span>
        </a>
        <nav class="site-nav" aria-label="メイン">
          <a href="#">ホーム</a>
          <a href="#" aria-current="page">アーカイブ</a>
          <a href="#">コース</a>
          <a href="#">カレンダー</a>
          <a href="#">ダッシュボード</a>
        </nav>
        <div class="header-actions">
          <button class="toggle-button" type="button" aria-label="ライト/ダークテーマを切り替え">
            <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true">
              <path d="M17 12.6A7.6 7.6 0 0 1 7.4 3 7.6 7.6 0 1 0 17 12.6Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </header>
  </div>

  <div class="spec-block">
    <p class="spec-label">タブ (.tabs) — surface-2地のコンテナに、アクティブのみsurface面+primary文字+shadow-1</p>
    <div class="wrap">
      <div class="tabs" role="tablist" aria-label="学会情報の表示切り替え">
        <button class="tab active" type="button" role="tab" aria-selected="true">カレンダー</button>
        <button class="tab" type="button" role="tab" aria-selected="false">リスト</button>
      </div>
    </div>
  </div>

  <div class="spec-block">
    <p class="spec-label">フッター — 法務リンク + 運営表記</p>
    <footer class="footer">
      <div class="wrap footer-inner">
        <nav class="footer-nav" aria-label="フッター">
          <a href="#">About</a>
          <a href="#">利用規約</a>
          <a href="#">プライバシーポリシー</a>
          <a href="#">問い合わせ</a>
        </nav>
        <p class="footer-note">運営: 臨床学術ワーキンググループ</p>
      </div>
    </footer>
  </div>

</body>
</html>
