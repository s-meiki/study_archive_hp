<!-- @dsCard group="Components" name="バッジ・チップ" subtitle="基本バッジ/テーマチップ/ステータスバッジ" width="880" height="560" -->
<!--
  使い方 (AI向け):
  - 基本バッジ (.badge) はピル型・surface-2地・ink-2文字。資料有無などの中立的な付記に使う。
  - テーマ分類チップは基本バッジに8pxのカテゴリ色ドットを足したもの。固定順6種 (循環器/脳神経/感染症/基礎レクチャー/研究・認定/AI活用) のみを使い、順番を替えない。
  - ステータスバッジは12%ティント地+セマンティック色文字+7pxドット。確定/受付中=success、保留/締切間近=warning、中止/満席=dangerの3値のみ。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バッジ・チップ — 臨床学術WG Design System</title>
<style>
  :root {
    --surface-2: #eef2f8;
    --ink-2: #475569;
    --muted: #64748b;
    --success: #15803d;
    --warning: #b45309;
    --danger: #b91c1c;
    --success-tint: rgba(21, 128, 61, 0.12);
    --warning-tint: rgba(180, 83, 9, 0.12);
    --danger-tint: rgba(185, 28, 28, 0.12);
    --cat-1: #2a78d6;
    --cat-2: #1baf7a;
    --cat-3: #eda100;
    --cat-4: #008300;
    --cat-5: #4a3aa7;
    --cat-6: #e34948;
    --fs-xs: 12px;
    --font-sans: "Inter", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px; font-family: var(--font-sans);
    color: #0f172a; background: #f5f7fb;
  }
  .spec-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 10px; }
  .spec-label {
    width: 100%; margin: 22px 0 8px; font-size: 12px; font-weight: 700;
    letter-spacing: 0.04em; color: var(--muted);
  }
  .spec-label:first-child { margin-top: 0; }

  /* ===== 基本バッジ (app/ui/badge.module.css を忠実に移植) ===== */
  .badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px;
    border-radius: 999px; background: var(--surface-2); color: var(--ink-2);
    font-size: var(--fs-xs); font-weight: 500; white-space: nowrap;
  }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--badge-dot, var(--muted)); }
  .cat1 { --badge-dot: var(--cat-1); }
  .cat2 { --badge-dot: var(--cat-2); }
  .cat3 { --badge-dot: var(--cat-3); }
  .cat4 { --badge-dot: var(--cat-4); }
  .cat5 { --badge-dot: var(--cat-5); }
  .cat6 { --badge-dot: var(--cat-6); }

  .status { padding: 3px 12px 3px 10px; font-weight: 600; }
  .status-dot { width: 7px; height: 7px; background: currentColor; }
  .status-success { background: var(--success-tint); color: var(--success); }
  .status-warning { background: var(--warning-tint); color: var(--warning); }
  .status-danger { background: var(--danger-tint); color: var(--danger); }
</style>
</head>
<body>

  <div class="spec-label">基本バッジ (.badge) — ピル型・surface-2地・ink-2文字。資料有無などの中立的な付記。</div>
  <div class="spec-row">
    <span class="badge">スライドあり</span>
    <span class="badge">要点メモあり</span>
    <span class="badge">参考文献あり</span>
  </div>

  <div class="spec-label">テーマ分類チップ (カテゴリ色ドット付き・固定順6種のみ)</div>
  <div class="spec-row">
    <span class="badge cat1"><span class="dot" aria-hidden="true"></span>循環器</span>
    <span class="badge cat2"><span class="dot" aria-hidden="true"></span>脳神経</span>
    <span class="badge cat3"><span class="dot" aria-hidden="true"></span>感染症</span>
    <span class="badge cat4"><span class="dot" aria-hidden="true"></span>基礎レクチャー</span>
    <span class="badge cat5"><span class="dot" aria-hidden="true"></span>研究・認定</span>
    <span class="badge cat6"><span class="dot" aria-hidden="true"></span>AI活用</span>
  </div>

  <div class="spec-label">ステータスバッジ (12%ティント地+セマンティック色文字+7pxドット)</div>
  <div class="spec-row">
    <span class="badge status status-success"><span class="dot status-dot" aria-hidden="true"></span>登録受付中</span>
    <span class="badge status status-warning"><span class="dot status-dot" aria-hidden="true"></span>締切間近</span>
    <span class="badge status status-danger"><span class="dot status-dot" aria-hidden="true"></span>満席</span>
  </div>

</body>
</html>
