<!-- @dsCard group="Components" name="ボタン" subtitle="Primary / Secondary / Ghost / アイコン付き / 無効状態" width="760" height="440" -->
<!--
  使い方 (AI向け):
  - 主要アクションは1画面に1つだけ .primary。並列アクションは .secondary、行内の軽い操作は .ghost。
  - 高さ約38px・radius-md(10px)・14px/600 は固定。角丸をピル型 (999px) にしない。
  - 小サイズ (.sm) は padding 5px 12px / 12px。アイコンは gap 8px で文字の前後どちらにも置ける。
  - 無効状態は opacity .55 + cursor not-allowed。専用の危険色ボタンは作らない (危険操作は本文側の警告文で示す)。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ボタン — 臨床学術WG Design System</title>
<style>
  :root {
    --bg: #f5f7fb;
    --surface: #ffffff;
    --surface-2: #eef2f8;
    --ink: #0f172a;
    --ink-2: #475569;
    --muted: #64748b;
    --border: #e3e8f0;
    --primary: #4f46e5;
    --primary-strong: #4338ca;
    --on-primary: #ffffff;
    --radius-md: 10px;
    --fs-xs: 12px;
    --fs-sm: 14px;
    --font-sans: "Inter", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px; font-family: var(--font-sans);
    color: var(--ink); background: var(--bg);
  }
  .spec-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 0 0 10px; }
  .spec-label {
    width: 100%; margin: 22px 0 8px; font-size: 12px; font-weight: 700;
    letter-spacing: 0.04em; color: var(--muted);
  }
  .spec-label:first-child { margin-top: 0; }

  /* ===== ボタン (app/ui/button.module.css を忠実に移植) ===== */
  .button {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 9px 16px; border: 1px solid transparent; border-radius: var(--radius-md);
    font-family: inherit; font-size: var(--fs-sm); font-weight: 600; line-height: 1.4;
    cursor: pointer; text-decoration: none;
  }
  .primary { background: var(--primary); color: var(--on-primary); }
  .primary:hover { background: var(--primary-strong); }
  .secondary { background: var(--surface); border-color: var(--border); color: var(--ink-2); }
  .secondary:hover { background: var(--surface-2); color: var(--ink); }
  .ghost { background: transparent; color: var(--ink-2); }
  .ghost:hover { background: var(--surface-2); color: var(--ink); }
  .sm { padding: 5px 12px; font-size: var(--fs-xs); }
  .button:disabled { opacity: 0.55; cursor: not-allowed; }
</style>
</head>
<body>

  <div class="spec-label">通常サイズ (primary は1画面に1つだけ / secondary は並列アクション / ghost は行内の軽い操作)</div>
  <div class="spec-row">
    <button class="button primary" type="button">視聴済みにする</button>
    <button class="button secondary" type="button">条件をリセット</button>
    <button class="button ghost" type="button">未視聴に戻す</button>
  </div>

  <div class="spec-label">小サイズ (.sm — padding 5px 12px / 12px)</div>
  <div class="spec-row">
    <a class="button secondary sm" href="#">コースを見る</a>
    <button class="button secondary sm" type="button">.json をダウンロード</button>
    <button class="button ghost sm" type="button">キャンセル</button>
  </div>

  <div class="spec-label">無効状態 (opacity .55・cursor not-allowed)</div>
  <div class="spec-row">
    <button class="button primary" type="submit" disabled>送信中...</button>
    <button class="button secondary sm" type="button" disabled>コピー</button>
  </div>

  <div class="spec-label">アイコン付き (gap 8px。カレンダーの月送りナビで実使用)</div>
  <div class="spec-row">
    <button class="button ghost sm" type="button">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
        <path d="M8.5 3 5 7l3.5 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      前の月
    </button>
    <button class="button ghost sm" type="button">
      次の月
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
        <path d="M5.5 3 9 7l-3.5 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

</body>
</html>
