<!-- @dsCard group="Components" name="統計・進捗" subtitle="統計タイル/進捗バー(メーター・セグメント)/進捗リング" width="900" height="640" -->
<!--
  使い方 (AI向け):
  - 統計タイルは「12px/600/+0.06em muted ラベル → 28px/700 tabular 数値(+単位14px ink-2) → 12px muted 補足」の固定順。数値は必ず tabular-nums。
  - 進捗バーはメーター型(高さ6px・連続値)とセグメント型(nブロック・2pxギャップ)の2種。地は track-primary、フィルは primary (補助メーターのみ accent 可)。
  - 進捗リングは44px・ストローク4・丸端。0進捗時は弧を描かない(stroke-linecapのドット化を避ける)。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>統計・進捗 — 臨床学術WG Design System</title>
<style>
  :root {
    --surface: #ffffff;
    --ink: #0f172a;
    --ink-2: #475569;
    --muted: #64748b;
    --border: #e3e8f0;
    --primary: #4f46e5;
    --accent: #0369a1;
    --radius-lg: 14px;
    --shadow-1: 0 1px 2px rgba(16, 24, 40, 0.05);
    --fs-xs: 12px;
    --fs-sm: 14px;
    --fs-xl: 28px;
    --track-primary: #e0e7ff;
    --track-accent: #cde6f5;
    --font-sans: "Inter", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px; font-family: var(--font-sans);
    color: var(--ink); background: #f5f7fb;
  }
  .spec-label {
    margin: 0 0 12px; font-size: 12px; font-weight: 700;
    letter-spacing: 0.04em; color: var(--muted);
  }
  .spec-block + .spec-block { margin-top: 28px; }

  /* ===== 統計タイル (app/ui/stat.module.css を忠実に移植) ===== */
  .stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; max-width: 640px; }
  .stat {
    display: flex; flex-direction: column; gap: 2px; padding: 16px 18px;
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    background: var(--surface); box-shadow: var(--shadow-1);
  }
  .stat-label { color: var(--muted); font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.06em; }
  .stat-value {
    color: var(--ink); font-size: var(--fs-xl); font-weight: 700;
    font-variant-numeric: tabular-nums; letter-spacing: -0.01em; line-height: 1.25;
  }
  .stat-unit { margin-left: 2px; color: var(--ink-2); font-size: var(--fs-sm); font-weight: 600; }
  .stat-slot { margin: 8px 0 4px; }
  .stat-foot { color: var(--muted); font-size: var(--fs-xs); }

  /* ===== 進捗バー (app/ui/progress-bar.module.css を忠実に移植) ===== */
  .bar-stack { display: grid; gap: 16px; max-width: 420px; }
  .bar-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    margin-bottom: 6px; color: var(--muted); font-size: var(--fs-xs);
  }
  .bar-head strong { color: var(--ink); font-weight: 700; }
  .meter { height: 6px; border-radius: 3px; background: var(--track-primary); overflow: hidden; }
  .meter.accent { background: var(--track-accent); }
  .meter-fill { display: block; height: 100%; border-radius: 3px; background: var(--primary); }
  .meter.accent .meter-fill { background: var(--accent); }
  .segments { display: grid; gap: 2px; }
  .segments > span { height: 6px; background: var(--track-primary); }
  .segments > span:first-child { border-radius: 3px 0 0 3px; }
  .segments > span:last-child { border-radius: 0 3px 3px 0; }
  .segments > span.done { background: var(--primary); }

  /* ===== 進捗リング (app/ui/progress-ring.module.css を忠実に移植) ===== */
  .ring-row { display: flex; gap: 24px; align-items: center; }
  .ring { flex: none; width: 44px; height: 44px; }
  .ring-track { fill: none; stroke: var(--track-primary); stroke-width: 4; }
  .ring-fill { fill: none; stroke: var(--primary); stroke-width: 4; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 22px 22px; }
  .ring-value { fill: var(--ink); font-family: var(--font-sans); font-size: 11px; font-weight: 600; }
</style>
</head>
<body>

  <div class="spec-block">
    <p class="spec-label">統計タイル (.stat) — label → value(+unit) → 任意スロット → foot の固定順</p>
    <div class="stat-grid">
      <div class="stat">
        <span class="stat-label">開催回数</span>
        <span class="stat-value tabular-nums">64<span class="stat-unit">回</span></span>
        <span class="stat-foot">2020年開始</span>
      </div>
      <div class="stat">
        <span class="stat-label">公開アーカイブ</span>
        <span class="stat-value tabular-nums">52<span class="stat-unit">件</span></span>
        <div class="stat-slot">
          <div class="meter accent" role="progressbar" aria-valuemin="0" aria-valuemax="64" aria-valuenow="52">
            <span class="meter-fill" style="width: 81%;"></span>
          </div>
        </div>
        <span class="stat-foot">全64回中</span>
      </div>
      <div class="stat">
        <span class="stat-label">テーマ分類</span>
        <span class="stat-value tabular-nums">6</span>
        <span class="stat-foot">固定6分類</span>
      </div>
    </div>
  </div>

  <div class="spec-block">
    <p class="spec-label">進捗バー — メーター型(連続値・高さ6px)とセグメント型(nブロック・2pxギャップ)</p>
    <div class="bar-stack">
      <div>
        <div class="bar-head"><strong>7/8 レッスン完了</strong><span>88%</span></div>
        <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="8" aria-valuenow="7">
          <span class="meter-fill" style="width: 88%;"></span>
        </div>
      </div>
      <div>
        <div class="bar-head"><strong>3/8 レッスン完了</strong><span>38%</span></div>
        <div class="segments" style="grid-template-columns: repeat(8, 1fr);" role="progressbar" aria-valuemin="0" aria-valuemax="8" aria-valuenow="3">
          <span class="done"></span><span class="done"></span><span class="done"></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </div>

  <div class="spec-block">
    <p class="spec-label">進捗リング (44px・ストローク4・丸端)</p>
    <div class="ring-row">
      <svg class="ring" viewBox="0 0 44 44" role="img" aria-label="進捗 6/8">
        <circle class="ring-track" cx="22" cy="22" r="18"/>
        <circle class="ring-fill" cx="22" cy="22" r="18" stroke-dasharray="84.8 113.1"/>
        <text class="ring-value" x="22" y="26" text-anchor="middle">6/8</text>
      </svg>
      <svg class="ring" viewBox="0 0 44 44" role="img" aria-label="進捗 8/8">
        <circle class="ring-track" cx="22" cy="22" r="18"/>
        <circle class="ring-fill" cx="22" cy="22" r="18" stroke-dasharray="113.1 113.1"/>
        <text class="ring-value" x="22" y="26" text-anchor="middle">8/8</text>
      </svg>
    </div>
  </div>

</body>
</html>
