<!-- @dsCard group="Assets" name="OGP書き出し原稿" subtitle="1200x630 フルブリード (ogp.png生成用)" width="1200" height="630" -->
<!--
  使い方 (AI向け):
  - ogp.png を再生成するための実寸原稿。templates/social.html のOGP型のフルブリード版 (角丸・影・外枠なし)。
  - 書き出し: リポジトリルートで design-system/README.md「OGP画像の書き出し」のコマンドを実行する。
  - 見出しはブランド代表コピー、下段はサイト全体数値のスタットチップ。
    人名・絵文字・感嘆符・誇大表現を入れない。パルス波形マーク (foundations/brand.html が正) を改変せず使う。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>OGP書き出し原稿 — 臨床学術WG Design System</title>
<style>
  :root {
    --bg: #f5f7fb; --surface: #ffffff; --surface-2: #eef2f8;
    --ink: #0f172a; --ink-2: #475569; --muted: #64748b; --border: #e3e8f0;
    --primary: #4f46e5; --on-primary: #ffffff;
    --track-primary: #e0e7ff;
    --font-sans: "Inter", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { padding: 0; }
  body { font-family: var(--font-sans); }
  .og {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 64px 72px 56px; background: var(--bg);
  }
  /* 装飾: 右下の大きなパルス波形 (トラック色) */
  .og-wave {
    position: absolute; right: -40px; bottom: 88px; width: 640px; height: 320px;
  }
  .og-brand { position: relative; display: flex; align-items: center; gap: 18px; }
  .og-brand svg { display: block; }
  .og-brand-name { color: var(--ink); font-size: 34px; font-weight: 700; letter-spacing: 0.02em; }
  .og-brand-sub { margin-left: 2px; color: var(--muted); font-size: 22px; font-weight: 500; }
  .og-main { position: relative; }
  .og-title {
    color: var(--ink); font-size: 76px; font-weight: 700;
    letter-spacing: -0.01em; line-height: 1.22;
  }
  .og-title em { font-style: normal; color: var(--primary); }
  .og-lead {
    margin-top: 22px;
    color: var(--ink-2); font-size: 30px; font-weight: 500; line-height: 1.55;
  }
  .og-foot { position: relative; display: flex; align-items: center; gap: 16px; }
  .og-stat {
    display: inline-flex; align-items: baseline; gap: 10px;
    padding: 16px 26px; border: 1px solid var(--border); border-radius: 14px;
    background: var(--surface); box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
  }
  .og-stat .label { color: var(--muted); font-size: 22px; font-weight: 600; letter-spacing: 0.02em; }
  .og-stat .value {
    color: var(--ink); font-size: 30px; font-weight: 700;
    font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
  }
  .og-stat .value small { margin-left: 2px; color: var(--ink-2); font-size: 22px; font-weight: 600; }
  .og-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: var(--primary); }
</style>
</head>
<body>
<div class="og">
  <svg class="og-wave" viewBox="0 0 320 160" fill="none" aria-hidden="true">
    <path d="M0 96h56l24-58 30 88 20-48h54l22-30 26 62 18-40h70"
          stroke="var(--track-primary)" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="og-brand">
    <svg width="64" height="64" viewBox="0 0 28 28" aria-hidden="true">
      <rect x="1" y="1" width="26" height="26" rx="7" fill="var(--primary)"/>
      <path d="M6 15h4l2.5-6 3 9 2-5h4.5" fill="none" stroke="var(--on-primary)"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="og-brand-name">臨床学術ワーキンググループ</span>
    <span class="og-brand-sub">勉強会アーカイブ</span>
  </div>

  <div class="og-main">
    <h1 class="og-title">必要な勉強会に、<br><em>すぐ届く。</em></h1>
    <p class="og-lead">薬剤師・医療従事者のための勉強会アーカイブ。<br>録画・資料・確認クイズで、復習から実践へつなげる。</p>
  </div>

  <div class="og-foot">
    <span class="og-stat"><span class="label">アーカイブ</span><span class="value">24<small>本</small></span></span>
    <span class="og-stat"><span class="label">コース</span><span class="value">6<small>本</small></span></span>
    <span class="og-stat"><span class="label">確認クイズ</span><span class="value">86<small>問</small></span></span>
  </div>

  <div class="og-bar"></div>
</div>
</body>
</html>
